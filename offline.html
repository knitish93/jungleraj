<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ऑफ़लाइन | जंगल राज</title>
<meta name="theme-color" content="#0a0a0d">
<style>
  :root { --red: #c1272d; --saffron: #ff9933; --bg: #0a0a0d; --text: #e7e5e1; --muted: #a3a1a8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: grid; place-items: center; min-height: 100dvh; text-align: center; padding: 2rem; }
  .wrap { max-width: 480px; }
  svg { width: 80px; height: 80px; color: var(--red); margin: 0 auto 2rem; display: block; }
  h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
  p { color: var(--muted); line-height: 1.7; margin-bottom: 2rem; font-size: 1rem; }
  a { display: inline-block; padding: .75rem 2rem; background: var(--red); color: #fff; text-decoration: none; border-radius: 999px; font-weight: 600; font-size: .9rem; transition: opacity .2s; }
  a:hover { opacity: .85; }
  .brand { font-size: 1.5rem; font-weight: 800; color: var(--saffron); margin-bottom: 3rem; letter-spacing: -.02em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">जंगल राज</div>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M18.364 5.636a9 9 0 1 0-12.728 12.728 9 9 0 0 0 12.728-12.728z"/>
    <path d="M3 3l18 18"/>
  </svg>
  <h1>आप ऑफ़लाइन हैं</h1>
  <p>इंटरनेट कनेक्शन उपलब्ध नहीं है। कृपया अपना नेटवर्क जाँचें और पुनः प्रयास करें।</p>
  <p style="font-size:.85rem;margin-bottom:1.5rem">जंगल राज के कुछ पृष्ठ ऑफ़लाइन भी उपलब्ध हो सकते हैं।</p>
  <a href="/">होमपेज पर जाएँ</a>
</div>
</body>
</html>
